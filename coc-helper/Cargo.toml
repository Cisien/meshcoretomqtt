[package]
name = "observer-coc-helper"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
bluer = { version = "=0.17.4", default-features = false, features = ["l2cap", "bluetoothd"] }
dbus = { version = "0.9", features = ["vendored"] }
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
